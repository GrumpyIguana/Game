<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cube Relay</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <div id="hud">
      <h1>Cube Relay</h1>
      <p>Reach the exit by placing both energy cubes on glowing pads.</p>
      <p><strong>Move:</strong> WASD &nbsp; <strong>Look:</strong> Mouse &nbsp; <strong>Interact:</strong> E</p>
      <p><strong>Reset:</strong> R</p>
      <p id="status">Click to start. Door is locked.</p>
    </div>
    <div id="crosshair">+</div>

    <script type="module" src="game.js"></script>
  </body>
